name: build-cv

on:
  push:
    branches: [main, 'cv/ia-recherche-2026']
    tags: ['v*']
  pull_request:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    # Secrets are not available to workflows triggered by pull requests from forks.
    # Same-repository PRs can still build normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-plain-generic tex-gyre \
            texlive-pictures texlive-fonts-extra poppler-utils

      - name: Use empty personal data template for pull requests
        if: github.event_name == 'pull_request'
        run: cp content/personal.example.tex content/personal.tex

      - name: Generate private personal data file
        if: github.event_name != 'pull_request'
        env:
          CV_NAME: ${{ secrets.CV_NAME }}
          CV_CITY: ${{ secrets.CV_CITY }}
          CV_EMAIL: ${{ secrets.CV_EMAIL }}
          CV_PHONE: ${{ secrets.CV_PHONE }}
          CV_LINKEDIN_ID: ${{ secrets.CV_LINKEDIN_ID }}
          CV_GITHUB_USER: ${{ secrets.CV_GITHUB_USER }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def latex_escape(value: str) -> str:
              replacements = {
                  "\\": r"\textbackslash{}",
                  "&": r"\&", "%": r"\%", "$": r"\$",
                  "#": r"\#", "_": r"\_", "{": r"\{",
                  "}": r"\}", "~": r"\textasciitilde{}",
                  "^": r"\textasciicircum{}",
              }
              return "".join(replacements.get(char, char) for char in value)

          phone = re.sub(r"[^0-9+]", "", os.environ["CV_PHONE"])
          if not re.fullmatch(r"\+[1-9][0-9]{7,14}", phone):
              raise SystemExit("CV_PHONE must be international, e.g. +33612345678")

          fields = {
              "cvName": "CV_NAME",
              "cvCity": "CV_CITY",
              "cvEmail": "CV_EMAIL",
              "cvPhone": "CV_PHONE",
              "cvLinkedinId": "CV_LINKEDIN_ID",
              "cvGithubUser": "CV_GITHUB_USER",
          }
          missing = [secret for secret in fields.values() if not os.environ.get(secret)]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))

          lines = [
              "% Generated by GitHub Actions. Do not commit this file.",
              *[
                  "\\newcommand{\\" + macro + "}{" + latex_escape(os.environ[secret]) + "}"
                  for macro, secret in fields.items()
              ],
              "\\newcommand{\\cvPhoneURI}{" + phone + "}",
              "",
          ]
          Path("content/personal.tex").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Build the CVs
        run: make

      - name: Check PDF page count, text extraction and embedded fonts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pdfs=(build/*.pdf)
          test "${#pdfs[@]}" -eq 4
          for pdf in "${pdfs[@]}"; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            if [ "$pages" != "1" ]; then
              echo "::error file=$pdf::Expected exactly one page, got $pages"
              exit 1
            fi
            text_file="${pdf%.pdf}.txt"
            pdftotext -layout "$pdf" "$text_file"
            if [ ! -s "$text_file" ] || [ "$(wc -c < "$text_file")" -lt 100 ]; then
              echo "::error file=$pdf::Text extraction is empty or unexpectedly short"
              exit 1
            fi
            # pdffonts has a two-word "Type 1" field; count backwards from the
            # stable trailing columns (emb, sub, uni, object ID) instead.
            if ! pdffonts "$pdf" | awk 'NR > 2 && $(NF-4) != "yes" { bad=1; print; } END { exit bad }'; then
              echo "::error file=$pdf::At least one font is not embedded"
              exit 1
            fi
            python3 -c 'import pathlib,sys; pdf,path=sys.argv[1:]; text=pathlib.Path(path).read_text(encoding="utf-8",errors="replace").casefold(); labels=("formation","expériences","projets") if "_one_column_fr" in pdf else ("education","experience","projects") if "_one_column_en" in pdf else ("expériences","projets","formation") if "_two_columns_fr" in pdf else ("experience","projects","education"); positions=[text.find(label) for label in labels]; sys.exit(0 if all(pos >= 0 for pos in positions) and positions == sorted(positions) else f"{pdf}: expected reading order {labels}, got {positions}")' "$pdf" "$text_file"
          done

      - name: Render PDF previews
        run: |
          for pdf in build/*.pdf; do
            pdftoppm -f 1 -l 1 -singlefile -png -r 120 "$pdf" "build/preview-$(basename "${pdf%.pdf}")"
          done

      - name: Upload PDFs and visual previews
        uses: actions/upload-artifact@v4
        with:
          name: cv-review
          path: |
            build/*.pdf
            build/preview-*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download generated PDFs
        uses: actions/download-artifact@v4
        with:
          name: cv-review
          path: dist
      - name: Create a release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
