name: build-cv

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # nécessaire pour publier une release lors d'un tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-pictures

      - name: Compiler les CV
        run: make

      - name: Publier les PDF en artefact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: build/*.pdf

      - name: Créer une release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.pdf
