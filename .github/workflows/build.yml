name: build-cv

on:
  push:
    branches: [main, 'cv/ia-recherche-2026']
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # required to publish a release on tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-plain-generic tex-gyre \
            texlive-pictures texlive-fonts-extra

      - name: Build the CVs
        run: make

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: build/*.pdf

      - name: Create a release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.pdf
